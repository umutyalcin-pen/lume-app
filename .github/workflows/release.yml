name: Release Lume binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Release Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build CLI version
        run: |
          cd "cli version lume"
          go build -o Lume_LITE.exe .
          Compress-Archive -Path Lume_LITE.exe -DestinationPath Lume_LITE.zip

      - name: Build GUI version
        run: |
          cd "go version lume"
          go build -ldflags="-H windowsgui" -o Lume_Pro.exe .
          Compress-Archive -Path Lume_Pro.exe -DestinationPath Lume_Pro.zip

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli version lume/Lume_LITE.zip
            go version lume/Lume_Pro.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
