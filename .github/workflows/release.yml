name: Release Lume binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Release Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python GUI version
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r "python version lume\requirements.txt"
          cd "python version lume"
          pyinstaller --noconfirm --onefile --windowed --name lume_python_gui --icon lume.ico --add-data "lume.png;." --add-data "lume.ico;." main.py

      - name: Build Go GUI version
        run: |
          cd "go version lume"
          go build -ldflags="-H windowsgui" -o lume_go_gui.exe .

      - name: Build CLI version
        run: |
          cd "cli version lume"
          go build -o lume_go_cli.exe .

      - name: Remove old release assets
        uses: actions/github-script@v7
        with:
          script: |
            const namesToRemove = new Set([
              'Lume.exe',
              'Lume_Pro.exe',
              'lume.cli.version.compact.exe',
              'Lume_Python_GUI.exe',
              'Lume_Go_GUI.exe',
              'Lume_Go_CLI.exe',
              'lume_python_gui.exe',
              'lume_go_gui.exe',
              'lume_go_cli.exe',
            ]);

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', ''),
            });

            for (const asset of release.data.assets) {
              if (!namesToRemove.has(asset.name)) {
                continue;
              }

              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            python version lume/dist/lume_python_gui.exe
            go version lume/lume_go_gui.exe
            cli version lume/lume_go_cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
